<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>랭크 셀프 피드백 아카이브</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
  html, body { margin: 0; height: 100%; }
  body { background: #f2f3f5; color: #111214; font-family: "Pretendard Variable", Pretendard, system-ui, sans-serif;
         display: flex; align-items: center; justify-content: center; }
  .box { background: #fff; border: 1px solid #dfe1e5; border-top: 2px solid #111214; padding: 40px 48px; max-width: 420px; margin: 24px; }
  .bar { height: 10px; margin: -40px -48px 32px; background: repeating-linear-gradient(-55deg, #3fe0e6 0 4px, transparent 4px 9px); }
  h1 { font-size: 22px; font-weight: 800; margin: 0 0 12px; }
  p { font-size: 15px; line-height: 1.6; color: #4a4d55; margin: 0; }
</style>
</head>
<body>
  <main class="box">
    <div class="bar" aria-hidden="true"></div>
    <h1>랭크 셀프 피드백 아카이브</h1>
    <p>지금 새 디자인으로 준비하고 있어요.</p>
  </main>
</body>
</html>
