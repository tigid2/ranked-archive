name: 리포트 만들기

# 피드백 글, 리포트 코드, 기준 데이터가 바뀌면 리포트 데이터와 화면(docs/report/)을 다시 만들어요. 화면 빌드는 1분 안쪽이에요.
# 새 판의 리포트 데이터는 "경기 기록 갱신"이 경기를 받은 직후에 같이 만들어요.
on:
  push:
    branches: [main]
    paths:
      - "feedback/**"
      - "web/**"
      - "tools/report/**"
      - "tools/analyze.py"
      - "benchmarks/*.json"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-games
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 리포트 데이터 만들기
        run: python tools/report/report_data.py --all

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: 화면 빌드
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: 바뀐 것 저장
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A analysis raw docs/report-data docs/report
          if git diff --cached --quiet; then
            echo "새로 저장할 내용이 없어요."
          else
            git commit -m "리포트 갱신"
            git pull --rebase
            git push
          fi
