name: 경기 기록 갱신

on:
  workflow_dispatch:
    inputs:
      wait:
        description: "새 게임이 없을 경우 최대 5분 대기"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: update-games
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 경기 데이터 다운로드
        env:
          RIOT_API_KEY: ${{ secrets.RIOT_API_KEY }}
          RIOT_ID: ${{ vars.RIOT_ID }}
          WAIT_FOR_NEW: ${{ inputs.wait }}
        run: python scripts/update.py

      - name: 바뀐 기록 저장
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A docs raw live
          if git diff --cached --quiet; then
            echo "새로 저장할 내용이 없어요."
          else
            git commit -m "경기 기록 갱신"
            git pull --rebase
            git push
          fi
